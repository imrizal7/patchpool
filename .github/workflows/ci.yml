name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry tests
        working-directory: contracts
        run: forge test
      - name: Run Slither when Solidity sources exist
        if: ${{ hashFiles('contracts/src/**/*.sol') != '' }}
        uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-args: --config-file contracts/slither.config.json
