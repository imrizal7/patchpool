services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: patchpool
      POSTGRES_USER: patchpool
      POSTGRES_PASSWORD: patchpool
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchpool -d patchpool"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
